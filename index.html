<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation decks</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #f4f1ea;
    }
    main { width: min(28rem, calc(100% - 2.5rem)); }
    h1 { font-weight: 600; font-size: 1.4rem; letter-spacing: -0.02em; }
    p { color: #b8b3a8; line-height: 1.5; }
    a.card {
      display: block;
      margin-top: 0.85rem;
      padding: 1rem 1.15rem;
      border: 1px solid #333;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      background: #1a1a1a;
    }
    a.card strong { display: block; font-size: 1.05rem; }
    a.card span { display: block; margin-top: 0.25rem; color: #8a857c; font-size: 0.9rem; }
    a.card:hover, a.card:focus { border-color: #888; outline: none; }
    a.soon { opacity: 0.55; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <h1>Presentation decks</h1>
    <p>Open a deck in your browser. Tap or swipe to move through it, and tap once to start the audio.</p>
    <a class="card" href="deck-a.html">
      <strong>Deck A</strong>
      <span>For local businesses</span>
    </a>
    <a class="card" href="deck-b.html">
      <strong>Deck B</strong>
      <span>For everyday people, cards and letters</span>
    </a>
  </main>
</body>
</html>
